<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>WEG Field Service</title>
<meta name="description" content="WEG Field Service — hourly field work tracking with pre/post work photos, vendor approval signatures, and Word/PDF daily status report generation." />
<meta name="theme-color" content="#00579d" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="back-btn" class="btn btn-ghost btn-sm hidden" onclick="history.back()">←</button>
      <img src="icons/icon-192.png" alt="WEG Field Service" class="brand-mark" />
      <div>
        <div class="topbar-title" id="topbar-title">WEG Field Service</div>
        <div class="topbar-sub" id="topbar-sub"></div>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="nav-btn" data-nav="today" onclick="location.hash='#/today'">
      <span class="nav-icon">🗓️</span>Today
    </button>
    <button class="nav-btn" data-nav="history" onclick="location.hash='#/history'">
      <span class="nav-icon">📜</span>History
    </button>
    <button class="nav-btn" data-nav="settings" onclick="location.hash='#/settings'">
      <span class="nav-icon">⚙️</span>Settings
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="js/db.js"></script>
<script src="js/camera.js"></script>
<script src="js/reportSections.js"></script>
<script src="js/testSections.js"></script>
<script src="js/vendor/docx.min.js"></script>
<script src="js/vendor/jspdf.min.js"></script>
<script src="js/vendor/jspdf.autotable.min.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
