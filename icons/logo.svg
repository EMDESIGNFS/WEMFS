<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WEG Field Service logo">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="50" cy="50" r="47" fill="url(#badgeGrad)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>

  <!-- Hourly dial ticks (12, like a clock face -> hourly schedule) -->
  <g stroke="#bfdbfe" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="8"  x2="50" y2="15"/>
    <line x1="50" y1="85" x2="50" y2="92"/>
    <line x1="8"  y1="50" x2="15" y2="50"/>
    <line x1="85" y1="50" x2="92" y2="50"/>
    <line x1="20.8" y1="20.8" x2="25.6" y2="25.6"/>
    <line x1="74.4" y1="74.4" x2="79.2" y2="79.2"/>
    <line x1="20.8" y1="79.2" x2="25.6" y2="74.4"/>
    <line x1="74.4" y1="25.6" x2="79.2" y2="20.8"/>
    <line x1="35" y1="11.5" x2="37.7" y2="18"/>
    <line x1="62.3" y1="82" x2="65" y2="88.5"/>
    <line x1="11.5" y1="65" x2="18" y2="62.3"/>
    <line x1="82" y1="37.7" x2="88.5" y2="35"/>
  </g>

  <!-- Electric machinery: lightning bolt -->
  <path d="M58 14 L34 55 L47.5 55 L40 89 L71 42 L54.5 42 Z"
        fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
